# Aplica supabase/migrations al proyecto correspondiente:
#   push a dev  -> environment "supabase-dev"  (Supabase DEV)
#   push a main -> environment "supabase-prod" (Supabase PROD, exige aprobación manual)
# Cada environment de GitHub necesita:
#   variable SUPABASE_PROJECT_REF
#   secreto SUPABASE_ACCESS_TOKEN (la CLI entra con un rol temporal, sin contraseña de la DB)
name: Migraciones

on:
  push:
    branches: [dev, main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migraciones-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'supabase-prod' || 'supabase-dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --yes
